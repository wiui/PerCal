name: Build PerCal Linux Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.7'
        
    - name: Install dependencies
      run: pip install pyinstaller
      
    - name: Build executable
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pyinstaller --onefile PerCal.py --name PerCal_linux
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PerCal-Linux-Executable
        path: dist/PerCal_linux
